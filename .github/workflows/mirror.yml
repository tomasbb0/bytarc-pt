name: Mirror bytarc.com to bytarc.pt

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tomasbb0/tomasbb0.github.io
          path: _site
      - name: Prepare the copy
        id: prep
        run: |
          echo "sha=$(git -C _site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          rm -rf _site/.git _site/.github _site/.claude _site/CNAME
          cp 404.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # GitHub pauses schedules in repos with no commits for 60 days, so record each new upstream
      # version and leave a monthly marker even when nothing changed.
      - name: Record the synced version
        run: |
          last=$(cat .last-sync 2>/dev/null || true)
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$last" != "${{ steps.prep.outputs.sha }}" ] || [ "$age" -gt 2592000 ]; then
            echo "${{ steps.prep.outputs.sha }}" > .last-sync
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .last-sync
            git commit -m "Sync bytarc.pt with bytarc.com ${{ steps.prep.outputs.sha }}"
            git push
          fi
